name: laravel-benchmark-ephpm-worker

services:
  app:
    build:
      context: ../..
      dockerfile: runtimes/ephpm-worker/Dockerfile
      args:
        # Session/cache store baked into the image; see README.md, "Benchmark
        # profiles". upstream (default) = database, which is what
        # app/.env.example ships; runtime = array. Build time, not run time:
        # `php artisan config:cache` bakes the drivers into the image.
        BENCH_PROFILE: "${BENCH_PROFILE:-upstream}"
    ports:
      - "8087:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      EPHPM_APP_BASE: /var/www/html
      # Dispatch-queue depth sweep knob. Unset => "0", which is ephpm.toml's
      # own default (0 => queue depth = worker_count). Overriding it through
      # the environment rather than the config file keeps the image byte
      # identical across every arm of the sweep, so queue depth is the only
      # variable. See RESULTS-EPHPM.md, "worker_backlog sweep".
      EPHPM_PHP__WORKER_BACKLOG: "${WORKER_BACKLOG:-0}"
      EPHPM_SERVER__METRICS__ENABLED: "${EPHPM_METRICS:-false}"
