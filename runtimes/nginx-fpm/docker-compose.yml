name: laravel-benchmark-nginx-fpm

services:
  php:
    build:
      context: ../..
      dockerfile: runtimes/nginx-fpm/Dockerfile
      args:
        # Session/cache store baked into the image; see README.md, "Benchmark
        # profiles". upstream (default) = database, which is what
        # app/.env.example ships; runtime = array. Build time, not run time:
        # `php artisan config:cache` bakes the drivers into the image.
        BENCH_PROFILE: "${BENCH_PROFILE:-upstream}"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
    expose:
      - "9000"
  nginx:
    image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    depends_on:
      - php
    ports:
      - "8085:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../app/public:/var/www/html/public:ro

  # Session store for BENCH_PROFILE=redis-sessions only, behind a Compose
  # profile so `compose up` does not start it for the other three profiles.
  # bench/run.sh sets COMPOSE_PROFILES=redis when that profile is selected.
  # The service name is `redis` because REDIS_HOST is baked into the image at
  # build time by `php artisan config:cache` and cannot be overridden at run
  # time. Stock configuration, deliberately untuned; what it actually runs with
  # is recorded in the run directory rather than asserted here.
  redis:
    image: redis:7-alpine@sha256:1db42ccef14898aa29bae778452d567534b59c107129cbc1163fb552de184d3c
    profiles: ["redis"]
    expose:
      - "6379"
