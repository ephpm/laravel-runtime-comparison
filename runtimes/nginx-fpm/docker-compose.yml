name: laravel-benchmark-nginx-fpm

services:
  php:
    build:
      context: ../..
      dockerfile: runtimes/nginx-fpm/Dockerfile
      args:
        # Session/cache store baked into the image; see README.md, "Benchmark
        # profiles". upstream (default) = database, which is what
        # app/.env.example ships; runtime = array. Build time, not run time:
        # `php artisan config:cache` bakes the drivers into the image.
        BENCH_PROFILE: "${BENCH_PROFILE:-upstream}"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
    expose:
      - "9000"
  nginx:
    image: nginx:1.31.3-alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    depends_on:
      - php
    ports:
      - "8085:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../app/public:/var/www/html/public:ro
